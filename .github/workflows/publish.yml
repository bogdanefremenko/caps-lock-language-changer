name: Build and Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release (win-x64)
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Publish
      run: >
        dotnet publish ./CapsSwitcher.csproj 
        -c Release 
        -r win-x64 
        --self-contained true 
        -p:PublishSingleFile=true 
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:DebugType=None
        -p:DebugSymbols=false
        -o ./publish

    - name: Package
      run: |
        $exePath = "./publish/CapsSwitcher.exe"
        $targetName = "./publish/CapsSwitcher-win-x64.exe"
        $zipName = "./publish/CapsSwitcher-${{ github.ref_name }}-win-x64.zip"

        Move-Item -Path $exePath -Destination $targetName

        Compress-Archive -Path $targetName -DestinationPath $zipName

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./publish/*.zip
          ./publish/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}