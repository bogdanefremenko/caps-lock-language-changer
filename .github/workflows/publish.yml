name: Build and Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release for ${{ matrix.target }}
    runs-on: windows-latest
    
    strategy:
      matrix:
        target: [win-x64, win-x86]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish
      run: >
        dotnet publish ./CapsSwitcher.csproj 
        -c Release 
        -r ${{ matrix.target }} 
        --self-contained true 
        -p:PublishSingleFile=true 
        -p:IncludeNativeLibrariesForSelfExtract=true
        -o ./publish

    - name: Rename Exe
      run: |
        cd ./publish
        Rename-Item -Path "CapsSwitcher.exe" -NewName "CapsSwitcher-${{ matrix.target }}.exe"

    - name: Zip Build
      run: Compress-Archive -Path ./publish/CapsSwitcher-${{ matrix.target }}.exe -DestinationPath ./publish/CapsSwitcher-${{ github.ref_name }}-${{ matrix.target }}.zip

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./publish/*.zip
          ./publish/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}